summary: Get current user info
tags:
  - Auth
security:
  - bearerAuth: []
responses:
  "200":
    description: Current user data
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            email:
              type: string
              format: email
              example: john@example.com
  "401":
    description: Unauthorized
