get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieve a list of all contacts with optional pagination.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      required: false
      description: Page number for pagination
      schema:
        type: integer
        example: 1
    - in: query
      name: perPage
      required: false
      description: Number of items per page
      schema:
        type: integer
        example: 10
  responses:
    "200":
      description: A list of contacts
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/contact.yaml#/Contact
