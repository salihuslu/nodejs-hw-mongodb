type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
    description: Unique identifier for the contact.
    example: '64e3b2f5c2a4d2b1e8f7a123'
  userId:
    type: string
    description: ID of the user who owns this contact.
    example: '64e3b2f5c2a4d2b1e8f7a456'
  name:
    type: string
    description: Full name of the contact.
    example: John Doe
  phoneNumber:
    type: string
    description: Primary phone number of the contact.
    example: '+1234567890'
  email:
    type: string
    description: Optional email address of the contact.
    example: 'john@doe.com'
  contactType:
    type: string
    description: Type of contact (e.g., personal, work, home).
    enum: ['work', 'home', 'personal']
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favourite.
    example: false
  photo:
    type: string
    format: binary
    description: Optional contact photo URL.